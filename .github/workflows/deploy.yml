name: Website CI & Deploy

on:
  pull_request:
    branches:
      - main
    paths:
      - 'website/**'
      - '.github/workflows/deploy.yml'
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - '.github/workflows/deploy.yml'

# The validation job only needs read access. Deployment gets write access
# at the job level because it publishes to the gh-pages branch.
permissions:
  contents: read

jobs:
  validate:
    name: Validate website
    concurrency: website-ci-${{ github.event.pull_request.number || github.ref }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan reachable Git history for high-confidence secrets
        shell: bash
        run: |
          set -euo pipefail
          blocked_file_patterns='(^|/)(\.env($|\.)|.*\.(pem|key|p12|pfx|jks|keystore)$|credentials\.|secrets\.)'
          if git rev-list --objects --all | grep -E "$blocked_file_patterns"; then
            echo 'Potential secret-bearing filename found in reachable Git history.'
            exit 1
          fi
          secret_pattern='BEGIN (RSA |OPENSSH )?PRIVATE KEY|AKIA[0-9A-Z]{16}|gh[oprsu]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|xox[baprs]-[A-Za-z0-9-]{20,}|sk-[A-Za-z0-9_-]{20,}'
          matches="$(git log --all --full-history -G "$secret_pattern" --oneline -- . || true)"
          if [[ -n "$matches" ]]; then
            echo 'High-confidence secret pattern matched in reachable commit history:'
            echo "$matches"
            exit 1
          fi
          echo 'Reachable Git history secret scan passed.'

      - name: Validate workflow YAML
        run: |
          ruby -e 'require "yaml"; ARGV.each { |f| YAML.parse_file(f); puts "YAML OK: #{f}" }' .github/workflows/*.yml

      - name: Validate shell script syntax
        run: bash -n website/build.sh

      - name: Validate JavaScript syntax
        run: |
          node --check website/js/main.js
          node --check website/js/theme-init.js

      - name: Validate website source
        run: python3 website/tests/validate.py website

      - name: Run negative validation test
        run: |
          tmpdir="$(mktemp -d)"
          cp -a website/. "$tmpdir/"
          printf '\n<img src="__missing-ci-test__.png" alt="negative test">\n' >> "$tmpdir/index.html"
          if python3 website/tests/validate.py "$tmpdir"; then
            echo 'Negative test unexpectedly passed.'
            exit 1
          fi
          echo 'Negative test correctly rejected a missing local asset.'

      - name: Build Website
        run: bash website/build.sh

      - name: Validate generated website
        run: python3 website/tests/validate.py website/dist

      - name: Validate required dist artifacts
        run: |
          test -f ./website/dist/index.html
          test -f ./website/dist/about.html
          test -f ./website/dist/features.html
          test -f ./website/dist/contributor.html
          test -f ./website/dist/privacy.html
          test -f ./website/dist/security.html
          test -f ./website/dist/support.html
          test -f ./website/dist/terms.html
          test -f ./website/dist/css/style.css
          test -f ./website/dist/js/main.js
          test -f ./website/dist/js/theme-init.js
          test -f ./website/dist/robots.txt
          test -f ./website/dist/sitemap.xml
          echo 'Website dist artifact validation passed.'

      - name: Ensure build output is not tracked
        run: |
          if git ls-files --error-unmatch website/dist >/dev/null 2>&1; then
            echo 'website/dist is tracked; generated output must remain ignored.'
            exit 1
          fi
          echo 'website/dist is not tracked.'

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    concurrency: website-deploy-main
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Website
        run: bash website/build.sh

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./website/dist
          publish_branch: gh-pages
